[package]
name = "gitdashy"
version = "2.39.2"
edition = "2021"
description = "PR dashboard with Claude reviews and shared team memory"
license = "MIT"
repository = "https://github.com/NeoMedSys/git-dashy"
default-run = "gitdashy"

[lib]
name = "gitdashy"
path = "src/lib.rs"

[[bin]]
name = "gitdashy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
getrandom = "0.3"
include_dir = "0.7"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simplelog = "0.12"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
urlencoding = "2"

# the app window's engine on Linux, already under tauri; direct only to turn off its click-to-play rule
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# A dev binary carries debuginfo for the whole graph and cargo never collects the superseded copies,
# so they filled a disk (#172). Dependencies lose it here, which costs stepping a debugger into
# their source and the line numbers on their backtrace frames. Our own frames keep theirs.
[profile.dev.package."*"]
debug = false
